<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sr-bg" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14110e"/>
      <stop offset="50%" stop-color="#1c1612"/>
      <stop offset="100%" stop-color="#0a0806"/>
    </linearGradient>
    <linearGradient id="sr-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6a3d"/>
      <stop offset="100%" stop-color="#ff4502"/>
    </linearGradient>
    <filter id="sr-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="16" fill="url(#sr-bg)"/>
  <circle cx="400" cy="225" r="160" fill="#ff4502" opacity="0.12" filter="url(#sr-glow)"/>
  <circle cx="620" cy="120" r="120" fill="#f59e0b" opacity="0.08" filter="url(#sr-glow)"/>

  <!-- Phone Mockup Container -->
  <g transform="translate(250, 25)">
    <!-- Phone Shell -->
    <rect x="0" y="0" width="300" height="400" rx="28" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
    <rect x="6" y="6" width="288" height="388" rx="24" fill="#09090b"/>

    <!-- Status Bar / Notch -->
    <rect x="100" y="12" width="100" height="18" rx="9" fill="#18181b"/>
    <circle cx="120" cy="21" r="3.5" fill="#3f3f46"/>

    <!-- App Header -->
    <text x="24" y="55" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="16">SR Restro</text>
    <rect x="180" y="42" width="86" height="20" rx="10" fill="#ff4502" fill-opacity="0.15"/>
    <text x="194" y="56" fill="#ff4502" font-family="monospace" font-weight="bold" font-size="10">TABLE #04</text>

    <!-- Search / Filter Pill -->
    <rect x="24" y="74" width="242" height="32" rx="12" fill="#18181b" stroke="#27272a"/>
    <text x="40" y="94" fill="#71717a" font-family="system-ui, sans-serif" font-size="11">Search dishes, drinks, desserts...</text>

    <!-- Category Pills -->
    <rect x="24" y="116" width="60" height="22" rx="11" fill="url(#sr-accent)"/>
    <text x="38" y="131" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="600" font-size="10">All Menu</text>
    
    <rect x="92" y="116" width="56" height="22" rx="11" fill="#18181b"/>
    <text x="104" y="131" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="10">Burgers</text>
    
    <rect x="156" y="116" width="52" height="22" rx="11" fill="#18181b"/>
    <text x="168" y="131" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="10">Pizzas</text>

    <rect x="216" y="116" width="50" height="22" rx="11" fill="#18181b"/>
    <text x="226" y="131" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="10">Drinks</text>

    <!-- Food Item Card 1 -->
    <rect x="24" y="150" width="242" height="68" rx="14" fill="#18181b" stroke="#27272a"/>
    <!-- Icon Placeholder -->
    <rect x="36" y="162" width="44" height="44" rx="10" fill="#f59e0b" fill-opacity="0.2"/>
    <text x="48" y="189" font-size="20">🍔</text>
    <text x="90" y="176" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="12">Truffle Smash Burger</text>
    <text x="90" y="191" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="10">Double beef, aged cheddar</text>
    <text x="90" y="206" fill="#ff4502" font-family="system-ui, sans-serif" font-weight="bold" font-size="12">₹289</text>
    <rect x="220" y="184" width="34" height="24" rx="8" fill="url(#sr-accent)"/>
    <text x="233" y="200" fill="#ffffff" font-weight="bold" font-size="14">+</text>

    <!-- Food Item Card 2 -->
    <rect x="24" y="228" width="242" height="68" rx="14" fill="#18181b" stroke="#27272a"/>
    <rect x="36" y="240" width="44" height="44" rx="10" fill="#10b981" fill-opacity="0.2"/>
    <text x="48" y="267" font-size="20">🍕</text>
    <text x="90" y="254" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="12">Artisan Woodfire Pizza</text>
    <text x="90" y="269" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="10">Fresh basil, mozzarella</text>
    <text x="90" y="284" fill="#ff4502" font-family="system-ui, sans-serif" font-weight="bold" font-size="12">₹399</text>
    <rect x="220" y="262" width="34" height="24" rx="8" fill="url(#sr-accent)"/>
    <text x="233" y="278" fill="#ffffff" font-weight="bold" font-size="14">+</text>

    <!-- Smart Order Bar / Bottom Checkout -->
    <rect x="24" y="310" width="242" height="60" rx="16" fill="#1c1917" stroke="#ff4502" stroke-width="1.5" stroke-opacity="0.6"/>
    <circle cx="48" cy="340" r="14" fill="#10b981" fill-opacity="0.2"/>
    <text x="42" y="345" fill="#10b981" font-size="14">✓</text>
    <text x="70" y="334" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="9">LIVE KITCHEN TICKET</text>
    <text x="70" y="349" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="12">Cooking Order #08</text>
    <text x="210" y="342" fill="#ff4502" font-family="system-ui, sans-serif" font-weight="bold" font-size="14">₹688</text>
  </g>

  <!-- Side Floater Badges -->
  <g transform="translate(60, 160)">
    <rect width="150" height="48" rx="12" fill="#18181b" fill-opacity="0.9" stroke="#27272a"/>
    <text x="14" y="22" fill="#10b981" font-family="system-ui, sans-serif" font-weight="bold" font-size="12">● Instant KOT Sync</text>
    <text x="14" y="38" fill="#71717a" font-family="monospace" font-size="9">Sub-second printing</text>
  </g>

  <g transform="translate(580, 240)">
    <rect width="160" height="48" rx="12" fill="#18181b" fill-opacity="0.9" stroke="#27272a"/>
    <text x="14" y="22" fill="#ff4502" font-family="system-ui, sans-serif" font-weight="bold" font-size="12">● QR Table Ordering</text>
    <text x="14" y="38" fill="#71717a" font-family="monospace" font-size="9">Contactless Digital POS</text>
  </g>
</svg>
